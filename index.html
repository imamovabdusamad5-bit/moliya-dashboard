<head>

  <meta name="description" content="Moliyaviy boshqaruv paneli">

  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%233b82f6' width='100' height='100'/%3E%3Ctext x='50' y='60' font-size='50' text-anchor='middle' fill='white'%3E$%3C/text%3E%3C/svg%3E">
  <title>Moliyaviy Boshqaruv</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.5.0/Recharts.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script>
    const { useState, useEffect } = React;
    const { PieChart, Pie, Cell, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

    const Icon = ({ d, className = "" }) => (
      React.createElement('svg', { className: `inline-block ${className}`, width: '24', height: '24', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round' },
        React.createElement('path', { d })
      )
    );

    function App() {
      const [subscriptions, setSubscriptions] = useState([]);
      const [income, setIncome] = useState(5000);
      const [expenses, setExpenses] = useState([]);
      const [newSub, setNewSub] = useState({ name: '', amount: '', category: 'Koʻngilochar' });
      const [newExp, setNewExp] = useState({ name: '', amount: '', category: 'Oziq-ovqat' });

      useEffect(() => {
        const saved = localStorage.getItem('financeData');
        if (saved) {
          const data = JSON.parse(saved);
          setSubscriptions(data.subscriptions || []);
          setIncome(data.income || 5000);
          setExpenses(data.expenses || []);
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('financeData', JSON.stringify({ subscriptions, income, expenses }));
      }, [subscriptions, income, expenses]);

      const addSubscription = () => {
        if (newSub.name && newSub.amount) {
          setSubscriptions([...subscriptions, { 
            id: Date.now(), 
            name: newSub.name, 
            amount: parseFloat(newSub.amount),
            category: newSub.category 
          }]);
          setNewSub({ name: '', amount: '', category: 'Koʻngilochar' });
        }
      };

      const addExpense = () => {
        if (newExp.name && newExp.amount) {
          setExpenses([...expenses, { 
            id: Date.now(), 
            name: newExp.name, 
            amount: parseFloat(newExp.amount),
            category: newExp.category 
          }]);
          setNewExp({ name: '', amount: '', category: 'Oziq-ovqat' });
        }
      };

      const totalSubs = subscriptions.reduce((sum, sub) => sum + sub.amount, 0);
      const totalExp = expenses.reduce((sum, exp) => sum + exp.amount, 0);
      const totalSpent = totalSubs + totalExp;
      const remaining = income - totalSpent;

      const categoryData = {};
      [...subscriptions, ...expenses].forEach(item => {
        categoryData[item.category] = (categoryData[item.category] || 0) + item.amount;
      });

      const pieData = Object.entries(categoryData).map(([name, value]) => ({ name, value }));
      const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];

      const summaryData = [
        { name: 'Daromad', miqdor: income },
        { name: 'Xarajatlar', miqdor: totalSpent },
        { name: 'Qolgan', miqdor: remaining }
      ];

      return React.createElement('div', { className: 'min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 p-4 sm:p-6' },
        React.createElement('div', { className: 'max-w-7xl mx-auto' },
          React.createElement('h1', { className: 'text-2xl sm:text-4xl font-bold text-white mb-6 sm:mb-8 flex items-center gap-3' },
            Icon({ d: 'M3 3v18h18M7 16l4-4 4 4 6-6', className: 'text-blue-400' }),
            'Moliyaviy Panel'
          ),

          React.createElement('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-6 mb-6 sm:mb-8' },
            React.createElement('div', { className: 'bg-gradient-to-br from-blue-600 to-blue-700 rounded-xl p-4 sm:p-6 shadow-2xl' },
              React.createElement('p', { className: 'text-blue-100 text-sm mb-1' }, 'Daromad'),
              React.createElement('p', { className: 'text-2xl sm:text-3xl font-bold text-white' }, '$', income.toFixed(2))
            ),
            React.createElement('div', { className: 'bg-gradient-to-br from-red-600 to-red-700 rounded-xl p-4 sm:p-6 shadow-2xl' },
              React.createElement('p', { className: 'text-red-100 text-sm mb-1' }, 'Xarajatlar'),
              React.createElement('p', { className: 'text-2xl sm:text-3xl font-bold text-white' }, '$', totalSpent.toFixed(2))
            ),
            React.createElement('div', { className: `bg-gradient-to-br ${remaining >= 0 ? 'from-green-600 to-green-700' : 'from-orange-600 to-orange-700'} rounded-xl p-4 sm:p-6 shadow-2xl` },
              React.createElement('p', { className: 'text-green-100 text-sm mb-1' }, 'Qolgan'),
              React.createElement('p', { className: 'text-2xl sm:text-3xl font-bold text-white' }, '$', remaining.toFixed(2))
            )
          ),

          React.createElement('div', { className: 'mb-6 bg-slate-800 rounded-xl p-4 sm:p-6 shadow-2xl' },
            React.createElement('label', { className: 'block text-white mb-2 font-semibold' }, 'Oylik Daromad'),
            React.createElement('input', {
              type: 'number',
              value: income,
              onChange: (e) => setIncome(parseFloat(e.target.value) || 0),
              className: 'w-full px-4 py-3 bg-slate-700 text-white rounded-lg focus:ring-2 focus:ring-blue-500 outline-none'
            })
          ),

          React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6 mb-6 sm:mb-8' },
            React.createElement('div', { className: 'bg-slate-800 rounded-xl p-4 sm:p-6 shadow-2xl' },
              React.createElement('h2', { className: 'text-xl sm:text-2xl font-bold text-white mb-4' }, '💳 Obunalar'),
              React.createElement('div', { className: 'space-y-3 mb-4' },
                React.createElement('input', {
                  type: 'text',
                  placeholder: 'Obuna nomi',
                  value: newSub.name,
                  onChange: (e) => setNewSub({...newSub, name: e.target.value}),
                  className: 'w-full px-4 py-2 bg-slate-700 text-white rounded-lg outline-none focus:ring-2 focus:ring-purple-500'
                }),
                React.createElement('input', {
                  type: 'number',
                  placeholder: 'Miqdor',
                  value: newSub.amount,
                  onChange: (e) => setNewSub({...newSub, amount: e.target.value}),
                  className: 'w-full px-4 py-2 bg-slate-700 text-white rounded-lg outline-none focus:ring-2 focus:ring-purple-500'
                }),
                React.createElement('select', {
                  value: newSub.category,
                  onChange: (e) => setNewSub({...newSub, category: e.target.value}),
                  className: 'w-full px-4 py-2 bg-slate-700 text-white rounded-lg outline-none focus:ring-2 focus:ring-purple-500'
                },
                  React.createElement('option', null, 'Koʻngilochar'),
                  React.createElement('option', null, 'Xizmatlar'),
                  React.createElement('option', null, 'Boshqa')
                ),
                React.createElement('button', {
                  onClick: addSubscription,
                  className: 'w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-lg transition'
                }, '+ Obuna Qo\'shish')
              ),
              React.createElement('div', { className: 'space-y-2 max-h-64 overflow-y-auto' },
                subscriptions.map(sub =>
                  React.createElement('div', { key: sub.id, className: 'flex justify-between items-center bg-slate-700 p-3 rounded-lg' },
                    React.createElement('div', null,
                      React.createElement('p', { className: 'text-white font-medium' }, sub.name),
                      React.createElement('p', { className: 'text-slate-400 text-sm' }, sub.category)
                    ),
                    React.createElement('div', { className: 'flex items-center gap-3' },
                      React.createElement('span', { className: 'text-purple-400 font-bold' }, '$', sub.amount),
                      React.createElement('button', {
                        onClick: () => setSubscriptions(subscriptions.filter(s => s.id !== sub.id)),
                        className: 'text-red-400 hover:text-red-300'
                      }, '🗑️')
                    )
                  )
                )
              ),
              React.createElement('div', { className: 'mt-4 pt-4 border-t border-slate-600' },
                React.createElement('p', { className: 'text-white font-bold' }, 'Jami: $', totalSubs.toFixed(2))
              )
            ),

            React.createElement('div', { className: 'bg-slate-800 rounded-xl p-4 sm:p-6 shadow-2xl' },
              React.createElement('h2', { className: 'text-xl sm:text-2xl font-bold text-white mb-4' }, '💰 Xarajatlar'),
              React.createElement('div', { className: 'space-y-3 mb-4' },
                React.createElement('input', {
                  type: 'text',
                  placeholder: 'Xarajat nomi',
                  value: newExp.name,
                  onChange: (e) => setNewExp({...newExp, name: e.target.value}),
                  className: 'w-full px-4 py-2 bg-slate-700 text-white rounded-lg outline-none focus:ring-2 focus:ring-green-500'
                }),
                React.createElement('input', {
                  type: 'number',
                  placeholder: 'Miqdor',
                  value: newExp.amount,
                  onChange: (e) => setNewExp({...newExp, amount: e.target.value}),
                  className: 'w-full px-4 py-2 bg-slate-700 text-white rounded-lg outline-none focus:ring-2 focus:ring-green-500'
                }),
                React.createElement('select', {
                  value: newExp.category,
                  onChange: (e) => setNewExp({...newExp, category: e.target.value}),
                  className: 'w-full px-4 py-2 bg-slate-700 text-white rounded-lg outline-none focus:ring-2 focus:ring-green-500'
                },
                  React.createElement('option', null, 'Oziq-ovqat'),
                  React.createElement('option', null, 'Transport'),
                  React.createElement('option', null, 'Kommunal'),
                  React.createElement('option', null, 'Sog\'liq'),
                  React.createElement('option', null, 'Boshqa')
                ),
                React.createElement('button', {
                  onClick: addExpense,
                  className: 'w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg transition'
                }, '+ Xarajat Qo\'shish')
              ),
              React.createElement('div', { className: 'space-y-2 max-h-64 overflow-y-auto' },
                expenses.map(exp =>
                  React.createElement('div', { key: exp.id, className: 'flex justify-between items-center bg-slate-700 p-3 rounded-lg' },
                    React.createElement('div', null,
                      React.createElement('p', { className: 'text-white font-medium' }, exp.name),
                      React.createElement('p', { className: 'text-slate-400 text-sm' }, exp.category)
                    ),
                    React.createElement('div', { className: 'flex items-center gap-3' },
                      React.createElement('span', { className: 'text-green-400 font-bold' }, '$', exp.amount),
                      React.createElement('button', {
                        onClick: () => setExpenses(expenses.filter(e => e.id !== exp.id)),
                        className: 'text-red-400 hover:text-red-300'
                      }, '🗑️')
                    )
                  )
                )
              ),
              React.createElement('div', { className: 'mt-4 pt-4 border-t border-slate-600' },
                React.createElement('p', { className: 'text-white font-bold' }, 'Jami: $', totalExp.toFixed(2))
              )
            )
          ),

          React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6' },
            React.createElement('div', { className: 'bg-slate-800 rounded-xl p-4 sm:p-6 shadow-2xl' },
              React.createElement('h3', { className: 'text-lg sm:text-xl font-bold text-white mb-4' }, 'Umumiy Holat'),
              React.createElement(ResponsiveContainer, { width: '100%', height: 300 },
                React.createElement(BarChart, { data: summaryData },
                  React.createElement(CartesianGrid, { strokeDasharray: '3 3', stroke: '#475569' }),
                  React.createElement(XAxis, { dataKey: 'name', stroke: '#94a3b8' }),
                  React.createElement(YAxis, { stroke: '#94a3b8' }),
                  React.createElement(Tooltip, { contentStyle: { backgroundColor: '#1e293b', border: 'none', borderRadius: '8px' } }),
                  React.createElement(Bar, { dataKey: 'miqdor', fill: '#3b82f6', radius: [8, 8, 0, 0] })
                )
              )
            ),

            pieData.length > 0 && React.createElement('div', { className: 'bg-slate-800 rounded-xl p-4 sm:p-6 shadow-2xl' },
              React.createElement('h3', { className: 'text-lg sm:text-xl font-bold text-white mb-4' }, 'Toifalar'),
              React.createElement(ResponsiveContainer, { width: '100%', height: 300 },
                React.createElement(PieChart, null,
                  React.createElement(Pie, {
                    data: pieData,
                    cx: '50%',
                    cy: '50%',
                    labelLine: false,
                    label: ({name, percent}) => `${name} ${(percent * 100).toFixed(0)}%`,
                    outerRadius: 80,
                    fill: '#8884d8',
                    dataKey: 'value'
                  },
                    pieData.map((entry, index) =>
                      React.createElement(Cell, { key: `cell-${index}`, fill: COLORS[index % COLORS.length] })
                    )
                  ),
                  React.createElement(Tooltip, { contentStyle: { backgroundColor: '#1e293b', border: 'none', borderRadius: '8px' } })
                )
              )
            )
          )
        )
      );
    }

    ReactDOM.render(React.createElement(App), document.getElementById('root'));

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('data:text/javascript,');
    }
  </script>
</body>
</html>
